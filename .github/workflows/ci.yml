name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the project is developed with, so CI and
          # local runs agree. Bump deliberately, together with pubspec.lock.
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # Drift's NativeDatabase loads the system SQLite in unit tests.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - run: flutter pub get

      # Drift tables and the localization classes are generated and
      # committed; a PR that changes their sources must commit the output.
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - run: flutter analyze

      - run: flutter test
